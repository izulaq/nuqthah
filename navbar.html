<!-- ============================================================
     NAVBAR PARTIAL — Nuqthah Learning Center
     Semua style dan script untuk navbar ada di sini.
     ============================================================ -->

<style>
    /* ===== RESET & BASE (hanya untuk navbar, tidak mengganggu halaman) ===== */
    .navbar * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* ===== NAVBAR ===== */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        background: #ffffff;
        padding: 10px 0;
        transition: all 0.3s ease;
        box-shadow: 0 1px 12px rgba(0, 0, 0, 0.06);
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .navbar .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .navbar .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: #0b1a17;
        letter-spacing: -0.3px;
        text-decoration: none;
    }

    .navbar .logo .logo-img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #0f4a3a;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .navbar .logo .logo-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .navbar .logo .logo-img i {
        font-size: 1.2rem;
        color: #ffffff;
    }

    .navbar .logo .logo-text {
        display: inline-block;
    }

    .navbar .logo .logo-text-sm {
        display: none;
    }

    .navbar .nav-links {
        display: flex;
        align-items: center;
        gap: 32px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .navbar .nav-links a {
        font-weight: 500;
        color: #3a4a47;
        transition: color 0.2s;
        font-size: 0.88rem;
        letter-spacing: 0.1px;
        position: relative;
        text-decoration: none;
    }

    .navbar .nav-links a::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: #c9a227;
        transition: width 0.3s ease;
    }

    .navbar .nav-links a:hover {
        color: #0b1a17;
    }

    .navbar .nav-links a:hover::after {
        width: 100%;
    }

    .navbar .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .navbar .btn-nav {
        background: #c9a227;
        color: #ffffff;
        padding: 8px 24px;
        border-radius: 60px;
        font-weight: 600;
        font-size: 0.82rem;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.2px;
        box-shadow: 0 2px 8px rgba(15, 74, 58, 0.15);
        text-decoration: none;
        display: inline-block;
    }

    .navbar .btn-nav:hover {
        background: #a18320;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(15, 74, 58, 0.25);
    }

    .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
    }

    .hamburger span {
        width: 24px;
        height: 2.5px;
        background: #0b1a17;
        border-radius: 4px;
        transition: all 0.3s ease;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
        .navbar .nav-links {
            display: none;
            flex-direction: column;
            background: #ffffff;
            position: absolute;
            top: 64px;
            left: 0;
            width: 100%;
            padding: 28px 32px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            gap: 18px;
            align-items: flex-start;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }

        .navbar .nav-links.open {
            display: flex;
        }

        .navbar .nav-actions .btn-nav {
            display: none;
        }

        .hamburger {
            display: flex;
        }

        .navbar .logo .logo-text {
            display: none;
        }

        .navbar .logo .logo-text-sm {
            display: inline-block;
        }
    }

    @media (max-width: 480px) {
        .navbar .logo .logo-img {
            width: 30px;
            height: 30px;
        }

        .navbar .logo {
            font-size: 0.95rem;
        }
    }
</style>

<!-- ===== HTML STRUKTUR NAVBAR ===== -->
<nav class="navbar" id="navbar">
    <div class="container">
        <a href="index.html" class="logo">
            <span class="logo-img">
                <img src="https://userkv.r2.mayar.id/landing-page/assets/nuqthah-kind-kingdom-2402/d50a2464_fdggdd.png"
                    alt="Nuqthah Logo"
                    onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'" />
            </span>
            <span class="logo-text">Nuqthah Learning Center</span>
            <span class="logo-text-sm">Nuqthah Learning Center</span>
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#tentang">Tentang</a></li>
            <li><a href="index.html#program">Program</a></li>
            <li><a href="index.html#faq">FAQ</a></li>
            <li><a href="index.html#kontak">Kontak</a></li>
            <li><a href="formpengajar.html">Pengajar</a></li>
        </ul>

        <div class="nav-actions">
            <a href="materi.html" class="btn-nav">Mulai Belajar</a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>

<!-- ===== SCRIPT NAVBAR ===== -->
<script>
    (function () {
        // Inisialisasi setelah DOM siap
        function initNavbar() {
            const navbar = document.getElementById('navbar');
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');

            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    navLinks.classList.toggle('open');
                });

                // Tutup menu saat klik link di dalamnya
                navLinks.querySelectorAll('a').forEach(function (link) {
                    link.addEventListener('click', function () {
                        navLinks.classList.remove('open');
                    });
                });

                // Tutup menu saat klik di luar navbar
                document.addEventListener('click', function (e) {
                    if (!navbar.contains(e.target)) {
                        navLinks.classList.remove('open');
                    }
                });
            }

            // Efek shadow scroll
            window.addEventListener('scroll', function () {
                if (!navbar) return;
                if (window.scrollY > 20) {
                    navbar.style.boxShadow = '0 2px 20px rgba(0,0,0,0.08)';
                } else {
                    navbar.style.boxShadow = '0 1px 12px rgba(0,0,0,0.06)';
                }
            });
        }

        // Jika document sudah siap, langsung jalankan
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initNavbar);
        } else {
            initNavbar();
        }
    })();
</script>
