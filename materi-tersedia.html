<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi Tersedia - Nuqthah Learning Center</title>
    <meta name="theme-color" content="#0F4A3A" />
    <link rel="icon" type="image/png" href="assets/logofix.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5E4E',
                        accent: '#C9A227',
                    },
                },
            },
        };
    </script>

    <style>
        /* ============================================================
           RESET & BASE (dari index.html)
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #0b1a17;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============================================================
           NAVBAR — LIGHT VERSION (dari index.html)
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: #ffffff;
            padding: 10px 0;
            transition: all 0.3s ease;
            box-shadow: 0 1px 12px rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b1a17;
            letter-spacing: -0.3px;
        }

        .navbar .logo .logo-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0f4a3a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar .logo .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .navbar .logo .logo-img i {
            font-size: 1.2rem;
            color: #ffffff;
        }

        .navbar .logo .logo-text {
            display: inline-block;
        }

        .navbar .logo .logo-text-sm {
            display: none;
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .navbar .nav-links a {
            font-weight: 500;
            color: #3a4a47;
            transition: color 0.2s;
            font-size: 0.88rem;
            letter-spacing: 0.1px;
            position: relative;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #c9a227;
            transition: width 0.3s ease;
        }

        .navbar .nav-links a:hover {
            color: #0b1a17;
        }

        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        .navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar .btn-nav {
            background: #c9a227;
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.82rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 8px rgba(15, 74, 58, 0.15);
        }

        .navbar .btn-nav:hover {
            background: #a18320;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 74, 58, 0.25);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .hamburger span {
            width: 24px;
            height: 2.5px;
            background: #0b1a17;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        /* ============================================================
           RESPONSIVE NAVBAR
           ============================================================ */
        @media (max-width: 768px) {
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                background: #ffffff;
                position: absolute;
                top: 64px;
                left: 0;
                width: 100%;
                padding: 28px 32px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.06);
                gap: 18px;
                align-items: flex-start;
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            }

            .navbar .nav-links.open {
                display: flex;
            }

            .navbar .nav-actions .btn-nav {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .navbar .logo .logo-text {
                display: none;
            }

            .navbar .logo .logo-text-sm {
                display: inline-block;
            }
        }

        /* ============================================================
           KONTEN UTAMA (dari materi-tersedia.html lama)
           ============================================================ */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .course-card {
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.08), 0 4px 10px -5px rgba(0, 0, 0, 0.04) !important;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.15) !important;
        }

        .card-title-min-h {
            min-height: 2.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .filter-bar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.75rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .filter-bar select,
        .filter-bar input {
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            padding: 0.4rem 1rem;
            font-size: 0.875rem;
            background: white;
            outline: none;
            transition: border 0.2s;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #2E5E4E;
        }

        .filter-bar input {
            flex: 1;
            min-width: 180px;
        }

        .filter-bar label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 640px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-bar>div {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                align-items: center;
            }
        }

        .fab-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fab-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
        }

        .fab-btn:hover {
            transform: scale(1.05);
        }

        .fab-btn.wa {
            background: #25D366;
        }

        #debug-info {
            background: #f8f9fa;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #374151;
        }

        #debug-info strong {
            color: #2E5E4E;
        }

        #debug-info .error {
            color: #dc2626;
        }

        #debug-info .success {
            color: #059669;
        }
    </style>
</head>

<body>

    <!-- ===== NAVBAR — SAMA DENGAN INDEX.HTML ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-img">
                    <img src="https://userkv.r2.mayar.id/landing-page/assets/nuqthah-kind-kingdom-2402/d50a2464_fdggdd.png"
                        alt="Nuqthah Logo"
                        onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'" />
                </span>
                <span class="logo-text">Nuqthah Learning Center</span>
                <span class="logo-text-sm">Nuqthah Learning Center</span>
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="materi.html">Katalog</a></li>
                <li><a href="afiliator.html">Afiliate</a></li>
                <li><a href="knowledge/knowledge.html">Tentang</a></li>
                <li><a href="#faq">FAQ</a></li>
                <li><a href="#kontak">Kontak</a></li>
                <li><a href="formpengajar.html">Pengajar</a></li>
            </ul>
            
            <div class="nav-actions">
                <a href="materi.html" class="btn-nav">Mulai Belajar</a>
                <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ===== KONTEN UTAMA ===== -->
    <main class="max-w-screen-xl mx-auto px-4 md:px-6 pt-24 pb-24">

        <header class="py-4 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-primary">📚 Materi Tersedia</h1>
            <p class="text-sm text-gray-500 mt-1">Semua materi yang siap diakses langsung</p>
        </header>

        <div id="debug-info" class="hidden"></div>

        <div class="filter-bar rounded-xl shadow-sm mb-6">
            <div class="flex items-center gap-2 flex-wrap">
                <label for="programFilter">Program</label>
                <select id="programFilter" class="min-w-[140px]">
                    <option value="all">Semua Program</option>
                </select>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <label for="subFilter">Sub</label>
                <select id="subFilter" class="min-w-[120px]">
                    <option value="all">Semua Sub</option>
                </select>
            </div>
            <div class="flex-1 min-w-[180px]">
                <input type="text" id="searchInput" placeholder="Cari materi..." class="w-full" />
            </div>
            <div class="text-sm text-gray-500" id="resultCount">0 materi</div>
        </div>

        <div id="course-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>

        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <i class="fas fa-search text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">Tidak ada materi yang sesuai</p>
            <p class="text-gray-400 text-sm">Coba ubah filter atau cari kata kunci lain</p>
        </div>
    </main>

    <!-- Floating WhatsApp -->
    <div class="fab-container">
        <a href="https://wa.me/6285185409887" target="_blank" class="fab-btn wa" aria-label="WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function () {
            'use strict';

            // ============================================================
            // NAVBAR INTERAKSI (dari index.html)
            // ============================================================
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', function () {
                if (window.scrollY > 20) {
                    navbar.style.boxShadow = '0 2px 20px rgba(0,0,0,0.08)';
                } else {
                    navbar.style.boxShadow = '0 1px 12px rgba(0,0,0,0.06)';
                }
            });

            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            hamburger.addEventListener('click', function () {
                navLinks.classList.toggle('open');
            });
            navLinks.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    navLinks.classList.remove('open');
                });
            });

            // ============================================================
            // FUNGSIONALITAS MATERI (dari materi-tersedia.html lama)
            // ============================================================

            const programLabels = {
                syariah: 'Bimbel Syariah',
                ushul: 'Bimbel Ushuluddin',
            };

            function getProgramLabel(category) {
                return programLabels[category] || category.charAt(0).toUpperCase() + category.slice(1);
            }

            let allCourses = [];

            const grid = document.getElementById('course-grid');
            const emptyState = document.getElementById('empty-state');
            const programFilter = document.getElementById('programFilter');
            const subFilter = document.getElementById('subFilter');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const debugInfo = document.getElementById('debug-info');

            async function fetchCourseData() {
                try {
                    console.log('🔍 Mengambil materi.html...');
                    const response = await fetch('materi.html');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const cards = doc.querySelectorAll('.course-card');
                    console.log(`📦 Ditemukan ${cards.length} course cards.`);
                    const courses = [];

                    cards.forEach((card) => {
                        const id = card.getAttribute('data-id') || '';
                        const category = card.getAttribute('data-category') || '';
                        const subfilter = card.getAttribute('data-subfilter') || '';
                        const review = card.getAttribute('data-review') || '';

                        const img = card.querySelector('img');
                        const image = img ? img.getAttribute('src') : '';

                        const titleEl = card.querySelector('h3');
                        const title = titleEl ? titleEl.textContent.trim() : '';

                        const infoItems = card.querySelectorAll('.flex-col.gap-0\\.5 .flex.items-center');
                        let pengajar = '';
                        let sesi = '';
                        infoItems.forEach((item, idx) => {
                            const span = item.querySelector('span');
                            if (span) {
                                const text = span.textContent.trim();
                                if (idx === 0) pengajar = text;
                                else if (idx === 1) sesi = text;
                            }
                        });

                        const priceSpan = card.querySelector('.text-primary.font-bold.text-base');
                        const price = priceSpan ? priceSpan.textContent.trim() : '';

                        const aksesBtn = card.querySelector('a[class*="bg-primary"]');
                        let aksesUrl = '#';
                        if (aksesBtn) {
                            const href = aksesBtn.getAttribute('href');
                            if (href && href !== '#' && href !== 'javascript:void(0)' && !href.startsWith('javascript:')) {
                                aksesUrl = href;
                            } else {
                                const onclick = aksesBtn.getAttribute('onclick');
                                if (onclick) {
                                    const match = onclick.match(/handleDaftar\s*\(\s*event\s*,\s*['"]([^'"]+)['"]\s*\)/);
                                    if (match && match[1] && match[1] !== '#') {
                                        aksesUrl = match[1];
                                    }
                                }
                            }
                        }

                        const available = aksesUrl && aksesUrl !== '#' && aksesUrl !== '';

                        const badgeEl = card.querySelector('.absolute.top-2.left-2');
                        const badge = badgeEl ? badgeEl.textContent.trim() : '';

                        courses.push({
                            id,
                            category,
                            subfilter,
                            review,
                            image,
                            title,
                            pengajar,
                            sesi,
                            price,
                            aksesUrl,
                            available,
                            badge,
                        });
                    });

                    const availableCourses = courses.filter(c => c.available);
                    console.log(`✅ Total cards: ${courses.length}, Tersedia: ${availableCourses.length}`);
                    return courses;
                } catch (err) {
                    console.error('❌ Gagal mengambil materi.html:', err);
                    return [];
                }
            }

            function renderCards(courses) {
                grid.innerHTML = '';
                if (courses.length === 0) {
                    emptyState.classList.remove('hidden');
                    resultCount.textContent = '0 materi';
                    return;
                }
                emptyState.classList.add('hidden');
                resultCount.textContent = courses.length + ' materi';

                courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className =
                        'course-card card-hover bg-white rounded-2xl overflow-hidden border border-gray-100 flex flex-col h-full fade-in';
                    card.setAttribute('data-id', course.id);
                    card.setAttribute('data-category', course.category);
                    card.setAttribute('data-subfilter', course.subfilter);
                    if (course.review) card.setAttribute('data-review', course.review);

                    card.innerHTML = `
                        <div class="relative overflow-hidden group aspect-[4/3]">
                            <img src="${course.image || 'https://userkv.r2.mayar.id/landing-page/assets/nuqthah-kind-kingdom-2402/d50a2464_fdggdd.png'}"
                                 alt="${course.title}"
                                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                                 loading="lazy"
                            />
                            <div class="absolute top-2 left-2 z-20 bg-white/90 backdrop-blur-sm text-primary px-2 py-0.5 rounded-full text-[10px] font-bold shadow-sm uppercase">
                                ${course.badge || course.subfilter || ''}
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="text-sm font-bold text-gray-800 leading-tight mb-2 card-title-min-h">${course.title}</h3>
                            <div class="flex flex-col gap-0.5 mb-3 text-[10px] text-gray-600">
                                <div class="flex items-center">
                                    <i class="fas fa-user-tie mr-2 text-accent w-3 text-center"></i>
                                    <span>${course.pengajar || 'Asatidzah Nuqthah'}</span>
                                </div>
                                <div class="flex items-center">
                                    <i class="far fa-calendar-check mr-2 text-primary w-3 text-center"></i>
                                    <span>${course.sesi || '12 Sesi'}</span>
                                </div>
                            </div>
                            <div class="mt-auto">
                                <div class="flex flex-col mb-2">
                                    <span class="text-primary font-bold text-base">${course.price || 'Rp 100.000'}</span>
                                    <span class="text-[8px] text-gray-400 uppercase tracking-wider font-semibold">Pembayaran via Mayar</span>
                                </div>
                                <a href="${course.aksesUrl}" target="_blank" rel="noopener noreferrer"
                                   class="w-full py-2 bg-primary hover:bg-opacity-90 text-white text-[11px] font-bold rounded-lg transition-all flex items-center justify-center gap-1">
                                    Akses <i class="fas fa-arrow-right text-[8px]"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            function applyFilters() {
                const prog = programFilter.value;
                const sub = subFilter.value;
                const query = searchInput.value.toLowerCase().trim();

                const filtered = allCourses.filter(c => {
                    if (!c.available) return false;
                    if (prog !== 'all' && c.category !== prog) return false;
                    if (sub !== 'all' && c.subfilter !== sub) return false;
                    if (query && !c.title.toLowerCase().includes(query) &&
                        !c.category.toLowerCase().includes(query) &&
                        !c.subfilter.toLowerCase().includes(query)) return false;
                    return true;
                });
                renderCards(filtered);
            }

            function updateProgramOptions() {
                const available = allCourses.filter(c => c.available);
                const categories = [...new Set(available.map(c => c.category))].sort();
                programFilter.innerHTML = '<option value="all">Semua Program</option>';
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = getProgramLabel(cat);
                    programFilter.appendChild(opt);
                });
                subFilter.innerHTML = '<option value="all">Semua Sub</option>';
            }

            function updateSubFilterOptions() {
                const selectedProgram = programFilter.value;
                const available = allCourses.filter(c => c.available);
                let subs = [];
                if (selectedProgram === 'all') {
                    subs = [...new Set(available.map(c => c.subfilter))].sort();
                } else {
                    subs = [...new Set(available.filter(c => c.category === selectedProgram).map(c => c.subfilter))].sort();
                }
                const currentSub = subFilter.value;
                subFilter.innerHTML = '<option value="all">Semua Sub</option>';
                subs.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s || 'Tanpa Sub';
                    subFilter.appendChild(opt);
                });
                if (subs.includes(currentSub)) {
                    subFilter.value = currentSub;
                } else {
                    subFilter.value = 'all';
                }
            }

            async function loadDataAndRender() {
                const courses = await fetchCourseData();
                allCourses = courses;
                const available = courses.filter(c => c.available);

                debugInfo.classList.remove('hidden');
                if (available.length === 0) {
                    debugInfo.innerHTML = `
                        <span class="error">⚠️ Tidak ada materi tersedia.</span>
                        Pastikan ada link akses yang valid di <strong>materi.html</strong> (bukan <code>#</code>).
                        <br><small>Total course cards: ${courses.length} | Tersedia: ${available.length}</small>
                    `;
                } else {
                    debugInfo.innerHTML = `
                        <span class="success">✅ ${available.length} materi yang tersedia</span>
                        dari total ${courses.length} materi.
                        <br><small>Kategori: ${[...new Set(available.map(c => getProgramLabel(c.category)))].join(', ')}</small>
                    `;
                }

                updateProgramOptions();
                updateSubFilterOptions();
                renderCards(available);
                programFilter.value = 'all';
                subFilter.value = 'all';
                searchInput.value = '';
            }

            document.addEventListener('DOMContentLoaded', function () {
                programFilter.addEventListener('change', function () {
                    applyFilters();
                    updateSubFilterOptions();
                });
                subFilter.addEventListener('change', applyFilters);
                searchInput.addEventListener('input', applyFilters);

                loadDataAndRender();
            });

        })();
    </script>

</body>

</html>
