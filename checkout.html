<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Checkout - Nuqthah Learning Center</title>
    <meta name="theme-color" content="#2E5E4E">
    <link rel="icon" type="image/png" href="assets/logofix.png">

    <!-- Fonts & CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5E4E',
                        accent: '#C9A227',
                    }
                }
            }
        }
    </script>

    <style>
        /* Reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* IFRAIN FULLSCREEN */
        .iframe-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            z-index: 1;
            background: #ffffff;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            display: block;
            background: #ffffff;
        }

        /* LOADING OVERLAY */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #2E5E4E;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ERROR PAGE (inside iframe wrapper) */
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
            color: #374151;
            background: #fff;
        }

        .error-page i {
            font-size: 4rem;
            color: #dc2626;
            margin-bottom: 1rem;
        }

        .error-page h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
        }

        .error-page p {
            margin: 0.5rem 0 1.5rem;
            color: #6b7280;
            max-width: 400px;
        }

        .error-page .btn-back {
            background: #2E5E4E;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .error-page .btn-back:hover {
            background: #1f4a3e;
        }

        /* ─── FLOATING CONTROLS ─── */
        .floating-controls {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            left: 12px;
            right: 12px;
            z-index: 9999;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            pointer-events: none;
            /* agar tidak menghalangi interaksi dengan iframe di area kosong */
            gap: 8px;
        }

        /* Kiri */
        .floating-left {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        /* Kanan */
        .floating-right {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* Tombol dasar */
        .float-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f2937;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
            min-height: 40px;
            line-height: 1;
            letter-spacing: 0.01em;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .float-btn i {
            font-size: 1rem;
            color: #2E5E4E;
            flex-shrink: 0;
        }

        .float-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        .float-btn:active {
            transform: scale(0.95);
        }

        /* Tombol khusus: Logo / Back */
        .float-btn-brand {
            background: rgba(46, 94, 78, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 6px 14px 6px 10px;
            gap: 8px;
        }

        .float-btn-brand i {
            color: #ffffff;
            font-size: 1rem;
        }

        .float-btn-brand:hover {
            background: rgba(46, 94, 78, 0.95);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .float-btn-brand .brand-text {
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
        }

        .float-btn-brand .brand-text .highlight {
            color: #C9A227;
        }

        /* Icon-only */
        .float-btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .float-btn-icon i {
            font-size: 1.05rem;
        }

        /* Review button (with text) */
        .float-btn-review {
            gap: 4px;
            padding: 8px 14px;
        }

        .float-btn-review i {
            font-size: 0.9rem;
        }

        /* WA button */
        .float-btn-wa {
            background: rgba(37, 211, 102, 0.2);
            border-color: rgba(37, 211, 102, 0.25);
        }

        .float-btn-wa i {
            color: #25D366;
        }

        .float-btn-wa:hover {
            background: rgba(37, 211, 102, 0.3);
        }

        /* Responsive: layar sangat kecil, tumpuk vertikal di kanan */
        @media (max-width: 480px) {
            .floating-controls {
                top: max(8px, env(safe-area-inset-top, 8px));
                left: 8px;
                right: 8px;
                gap: 6px;
            }

            .floating-right {
                gap: 6px;
            }

            .float-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
                min-height: 34px;
            }

            .float-btn-icon {
                width: 34px;
                height: 34px;
            }

            .float-btn-brand {
                padding: 4px 10px 4px 8px;
                font-size: 0.7rem;
            }

            .float-btn-brand .brand-text {
                font-size: 0.7rem;
            }

            .float-btn-review {
                padding: 6px 10px;
            }

            .float-btn-review span {
                display: none;
            }

            .float-btn-review i {
                font-size: 1rem;
            }
        }

        /* Layar sedang: review tetap tampil teks */
        @media (min-width: 481px) and (max-width: 768px) {
            .floating-controls {
                top: max(10px, env(safe-area-inset-top, 10px));
                left: 10px;
                right: 10px;
            }

            .float-btn {
                padding: 7px 12px;
                font-size: 0.75rem;
                min-height: 36px;
            }

            .float-btn-icon {
                width: 36px;
                height: 36px;
            }
        }

        /* Sembunyikan review jika tidak ada */
        .float-btn-review.hidden {
            display: none !important;
        }

        /* Tombol back di dalam brand */
        .float-btn-brand .back-only {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .float-btn-brand .back-only i {
            font-size: 0.9rem;
        }

        /* Pastikan tidak ada scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <!-- IFRAME FULLSCREEN -->
    <div class="iframe-wrapper" id="iframeWrapper">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>
        <iframe id="checkoutIframe" allow="payment *; clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" loading="lazy"></iframe>
    </div>

    <!-- FLOATING CONTROLS -->
    <div class="floating-controls">
        <!-- KIRI: Back + Logo -->
        <div class="floating-left">
            <button class="float-btn float-btn-brand" id="backBtn" aria-label="Kembali">
                <span class="back-only">
                    <i class="fas fa-arrow-left"></i>
                    <span class="brand-text hidden sm:inline">Nuqthah <span class="highlight">Learning</span></span>
                </span>
            </button>
        </div>

        <!-- KANAN: Refresh, Review, WhatsApp -->
        <div class="floating-right">
            <button class="float-btn float-btn-icon" id="refreshBtn" title="Refresh halaman checkout">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="float-btn float-btn-review" id="reviewBtn" title="Beri Ulasan">
                <i class="fas fa-star" style="color:#C9A227;"></i>
                <span>Review</span>
            </button>
            <a href="https://wa.me/6285185409887" target="_blank" class="float-btn float-btn-icon float-btn-wa"
                title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>

    <script>
            (function () {
                'use strict';

                // --- DOM refs ---
                const iframe = document.getElementById('checkoutIframe');
                const loading = document.getElementById('loadingOverlay');
                const backBtn = document.getElementById('backBtn');
                const refreshBtn = document.getElementById('refreshBtn');
                const reviewBtn = document.getElementById('reviewBtn');

                // --- Ambil parameter URL ---
                const urlParams = new URLSearchParams(window.location.search);
                const checkoutParam = urlParams.get('checkout');
                const courseId = urlParams.get('course') || '';
                const reviewUrl = urlParams.get('review') || '';
                const from = urlParams.get('from') || '';

                // --- Validasi URL checkout ---
                let validCheckoutUrl = null;
                if (checkoutParam) {
                    try {
                        const parsed = new URL(checkoutParam);
                        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
                            validCheckoutUrl = checkoutParam;
                            console.log('✅ Checkout URL valid:', validCheckoutUrl);
                        } else {
                            console.warn('⚠️ Protocol tidak diizinkan:', parsed.protocol);
                        }
                    } catch (e) {
                        console.warn('❌ Invalid checkout URL:', checkoutParam, e);
                    }
                } else {
                    console.warn('❌ Parameter "checkout" tidak ditemukan.');
                }

                // --- Tampilkan review button jika reviewUrl valid ---
                if (reviewUrl && reviewUrl.startsWith('http')) {
                    reviewBtn.classList.remove('hidden');
                } else {
                    reviewBtn.classList.add('hidden');
                }

                // --- Fungsi memuat iframe ---
                function loadIframe(url) {
                    if (!url) {
                        showError('URL tidak valid.');
                        return;
                    }
                    loading.classList.remove('hidden');
                    iframe.src = url;
                    iframe.onload = function () {
                        loading.classList.add('hidden');
                    };
                    // fallback timeout
                    setTimeout(function () {
                        loading.classList.add('hidden');
                    }, 15000);
                }

                // --- Tampilkan error ---
                function showError(message) {
                    const wrapper = document.getElementById('iframeWrapper');
                    // Hapus iframe & loading, tampilkan error
                    wrapper.innerHTML = `
                    <div class="error-page">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Oops!</h2>
                        <p>${message}</p>
                        <button class="btn-back" id="errorBackBtn">Kembali</button>
                    </div>
                `;
                    document.getElementById('errorBackBtn').addEventListener('click', function () {
                        handleBack();
                    });
                    loading.classList.add('hidden');
                }

                // --- Handle back ---
                function handleBack() {
                    if (from === 'materi') {
                        window.location.href = 'materi.html';
                    } else if (from === 'materi-tersedia') {
                        window.location.href = 'materi-tersedia.html';
                    } else {
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = 'index.html';
                        }
                    }
                }

                // --- Event listeners ---
                backBtn.addEventListener('click', handleBack);

                refreshBtn.addEventListener('click', function () {
                    if (validCheckoutUrl) {
                        const separator = validCheckoutUrl.includes('?') ? '&' : '?';
                        const urlWithCache = validCheckoutUrl + separator + '_t=' + Date.now();
                        loadIframe(urlWithCache);
                    } else {
                        alert('Tidak ada URL checkout yang valid untuk di-refresh.');
                    }
                });

                reviewBtn.addEventListener('click', function () {
                    if (reviewUrl && reviewUrl.startsWith('http')) {
                        const separator = reviewUrl.includes('?') ? '&' : '?';
                        const urlWithCache = reviewUrl + separator + '_t=' + Date.now();
                        loadIframe(urlWithCache);
                    }
                });

                // --- Muat iframe ---
                if (validCheckoutUrl) {
                    loadIframe(validCheckoutUrl);
                } else {
                    showError('Link checkout tidak valid. Silakan kembali dan coba lagi.');
                }

            })();
    </script>

</body>

</html>
